<!DOCTYPE html>
<html lang="es" data-tema="oscuro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Activos Fijos — App Farmacia</title>
  
  <!-- Tipografías de Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,400&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  
  <!-- Estilos CSS -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Contenedor Principal (Shell de Smartphone) -->
  <div class="layout">
    
    <!-- Top Bar / Encabezado de la App -->
    <header class="top-bar" id="encabezado">
      <!-- Se puebla dinámicamente desde script.js -->
    </header>

    <!-- Contenido Dinámico según la pestaña seleccionada -->
    <main id="contenido">
      <!-- Las secciones, tablas, ejercicios y calculadora se renderizan aquí -->
    </main>

    <!-- Navigation Tab Bar (Barra de Navegación Móvil Inferior) -->
    <nav class="indice" id="indice">
      <!-- Los botones de navegación con iconos se renderizan aquí -->
    </nav>

  </div>

  <!-- Lógica JavaScript -->
  <script src="script.js"></script>
</body>
</html>
